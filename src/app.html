<!doctype html>
<html lang="en" data-theme="timber-buddy" data-mode="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width" />
		<title>Timber Buddy</title>
		<script>
			// Apply the saved light/dark choice before first paint. Dark is the default.
			(function () {
				try {
					var mode = localStorage.getItem('color-mode');
					if (mode === 'light' || mode === 'dark') document.documentElement.setAttribute('data-mode', mode);
				} catch (e) {
					// localStorage unavailable: keep the default.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
